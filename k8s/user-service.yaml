apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: user-service
          image: REGISTRY/user-service:IMAGE_TAG
          ports:
            - containerPort: 5002
          env:
            - name: JWT_SECRET
              value: "supersecretkey_change_in_production"
            - name: DATABASE_URL
              value: "postgresql://postgres:password@user-db:5432/userdb"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: NAMESPACE
spec:
  selector:
    app: user-service
  ports:
    - port: 5002
      targetPort: 5002
