apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: REGISTRY/auth-service:IMAGE_TAG
          ports:
            - containerPort: 5001
          env:
            - name: JWT_SECRET
              value: "supersecretkey_change_in_production"
            - name: DATABASE_URL
              value: "postgresql://postgres:password@auth-db:5432/authdb"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: NAMESPACE
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001