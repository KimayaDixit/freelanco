apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api-gateway
          image: REGISTRY/api-gateway:IMAGE_TAG
          ports:
            - containerPort: 8000
          env:
            - name: JWT_SECRET
              value: "supersecretkey_change_in_production"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: USER_SERVICE_URL
              value: "http://user-service:5002"
            - name: JOB_SERVICE_URL
              value: "http://job-service:5003"
            - name: SERVICE_LISTING_URL
              value: "http://service-listing-service:5004"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:5005"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: NAMESPACE
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
