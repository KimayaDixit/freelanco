apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: job-service
          image: REGISTRY/job-service:IMAGE_TAG
          ports:
            - containerPort: 5003
          env:
            - name: JWT_SECRET
              value: "supersecretkey_change_in_production"
            - name: DATABASE_URL
              value: "postgresql://postgres:password@job-db:5432/jobdb"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: job-service
  namespace: NAMESPACE
spec:
  selector:
    app: job-service
  ports:
    - port: 5003
      targetPort: 5003
